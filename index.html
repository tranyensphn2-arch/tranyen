        function compressImage(file, callback, max_size = 300, quality = 0.8) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // M·ªói tab ghi nh·ªõ v·ªã tr√≠ cu·ªôn ri√™ng. Khi m·ªôt thao t√°c g·ªçi renderLayout(),
        // giao di·ªán ƒë∆∞·ª£c d·ª±ng l·∫°i nh∆∞ng ng∆∞·ªùi d√πng v·∫´n ƒë·ª©ng ƒë√∫ng v·ªã tr√≠ ƒëang l√†m vi·ªác.
        const uiScrollMemory = Object.create(null);
        let lastRenderedTabId = null;
        // V·ªã tr√≠ cu·ªôn c·ªßa menu tr√°i l√† tr·∫°ng th√°i to√†n c·ª•c, kh√¥ng ph·ª• thu·ªôc t·ª´ng tab.
        // Khi ch·ªçn m·ªôt tab, renderLayout() d·ª±ng l·∫°i sidebar; bi·∫øn n√†y gi√∫p tab ƒëang ch·ªçn
        // v·∫´n n·∫±m nguy√™n t·∫°i v·ªã tr√≠ ng∆∞·ªùi d√πng v·ª´a b·∫•m thay v√¨ menu nh·∫£y v·ªÅ ƒë·∫ßu.
        let sidebarMenuScrollTop = 0;

        function getPreservableScrollNodes(root) {
            if (!root) return [];
            const candidates = Array.from(root.querySelectorAll(
                '.overflow-x-auto, .overflow-y-auto, .custom-scrollbar, .classroom-map-scroll, .classroom-unassigned-pool'
            ));
            return candidates.filter(el => el !== root && (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth));
        }

        function captureUiScrollPosition() {
            // Sidebar ƒë∆∞·ª£c l∆∞u ƒë·ªôc l·∫≠p v·ªõi n·ªôi dung ch√≠nh. ƒê√¢y l√† ph·∫ßn quan tr·ªçng ƒë·ªÉ
            // khi b·∫•m Qu√† t·∫∑ng / T·ªï thi ƒëua / ƒêi·ªÉm danh... menu kh√¥ng quay l√™n ƒë·∫ßu.
            const sidebarMenu = document.getElementById('sidebar-menu-scroll');
            if (sidebarMenu) sidebarMenuScrollTop = sidebarMenu.scrollTop || 0;

            const main = document.getElementById('main-content');
            if (!main || !lastRenderedTabId) return;

            uiScrollMemory[lastRenderedTabId] = {
                top: main.scrollTop || 0,
                left: main.scrollLeft || 0,
                windowY: window.scrollY || 0,
                windowX: window.scrollX || 0,
                nested: getPreservableScrollNodes(main).map(el => ({
                    top: el.scrollTop || 0,
                    left: el.scrollLeft || 0
                }))
            };
        }

        function restoreUiScrollPosition(tabId) {
            const saved = uiScrollMemory[tabId] || { top: 0, left: 0, windowY: 0, windowX: 0, nested: [] };

            const applyPosition = () => {
                // Kh√¥i ph·ª•c sidebar tr∆∞·ªõc, ƒë·ªÉ n√∫t ƒëang ƒë∆∞·ª£c ch·ªçn ƒë·ª©ng nguy√™n v·ªã tr√≠.
                const currentSidebarMenu = document.getElementById('sidebar-menu-scroll');
                if (currentSidebarMenu) {
                    currentSidebarMenu.style.scrollBehavior = 'auto';
                    currentSidebarMenu.scrollTop = Number(sidebarMenuScrollTop) || 0;
                }

                const currentMain = document.getElementById('main-content');
                if (!currentMain) return;

                currentMain.style.scrollBehavior = 'auto';
                currentMain.scrollTop = Number(saved.top) || 0;
                currentMain.scrollLeft = Number(saved.left) || 0;

                const nestedNodes = getPreservableScrollNodes(currentMain);
                (saved.nested || []).forEach((pos, index) => {
                    const node = nestedNodes[index];
                    if (!node) return;
                    node.style.scrollBehavior = 'auto';
                    node.scrollTop = Number(pos.top) || 0;
                    node.scrollLeft = Number(pos.left) || 0;
                });

                try {
                    window.scrollTo({
                        top: Number(saved.windowY) || 0,
                        left: Number(saved.windowX) || 0,
                        behavior: 'auto'
                    });
                } catch (e) {
                    window.scrollTo(Number(saved.windowX) || 0, Number(saved.windowY) || 0);
                }
            };

            applyPosition();
            requestAnimationFrame(() => {
                applyPosition();
                requestAnimationFrame(applyPosition);
            });
            setTimeout(applyPosition, 0);
            setTimeout(applyPosition, 60);
            setTimeout(applyPosition, 160);
            setTimeout(applyPosition, 320);
        }

        }

        // =====================================================
        // S∆† ƒê·ªí L·ªöP - S·ªê CH·ªñ ƒê·ªòNG / 4 D√ÉY / CLICK CH·ªåN / PDF
        // =====================================================
        window.classroomUi = window.classroomUi || { selectedStudentId: null, swapSeatId: null };
        if (typeof window.classroomUi.swapSeatId === 'undefined') window.classroomUi.swapSeatId = null;

        function getClassroomDeskPlan() {
            const fallback = [6, 6, 6, 7];
            const rawPlan = state.classroomSeating?.deskPlan;
            if (!Array.isArray(rawPlan) || rawPlan.length !== 4) return [...fallback];

            return rawPlan.map((value, index) => {
                const parsed = Math.floor(Number(value));
                return Number.isFinite(parsed) && parsed >= 1 ? parsed : fallback[index];
            });
        }

        function getClassroomSeatIds() {
            const ids = [];
            getClassroomDeskPlan().forEach((deskCount, rowIndex) => {
                for (let deskIndex = 1; deskIndex <= deskCount; deskIndex++) {
                    ids.push(`D${rowIndex + 1}-B${deskIndex}-T`);
                    ids.push(`D${rowIndex + 1}-B${deskIndex}-P`);
                }
            });
            return ids;
        }

        // ================= ƒê·ªíNG B·ªò T·ªî THEO D√ÉY B√ÄN =================
        // D√£y 1 -> T·ªï 1 | D√£y 2 -> T·ªï 2 | D√£y 3 -> T·ªï 3 | D√£y 4 -> T·ªï 4.
        // Ch·ªâ c·∫≠p nh·∫≠t student.group; kh√¥ng thay ƒë·ªïi ch·ª©c v·ª•, ƒëi·ªÉm hay h·ªì s∆° kh√°c.
        function getClassroomGroupFromSeatId(seatId) {
            const match = String(seatId || '').match(/^D([1-4])-B\d+-(?:T|P)$/i);
            return match ? `T·ªï ${match[1]}` : '';
        }

        function syncClassroomStudentGroupForSeat(seatId, studentId) {
            const targetGroup = getClassroomGroupFromSeatId(seatId);
            if (!targetGroup || studentId === undefined || studentId === null || studentId === '') {
                return false;
            }

            const student = getClassroomStudentById(studentId);
            if (!student || student.group === targetGroup) return false;

            student.group = targetGroup;
            return true;
        }

        function syncAllClassroomGroupsFromAssignments() {
            ensureClassroomSeatingState();

            let changedCount = 0;
            const assignments = state.classroomSeating.assignments || {};

            Object.entries(assignments).forEach(([seatId, studentId]) => {
                if (syncClassroomStudentGroupForSeat(seatId, studentId)) {
                    changedCount++;
                }
            });

            return changedCount;
        }

        function ensureClassroomSeatingState() {
            if (!state.classroomSeating || typeof state.classroomSeating !== 'object') {
                state.classroomSeating = { version: 2, initialized: false, deskPlan: [6, 6, 6, 7], assignments: {} };
            }
            if (!Array.isArray(state.classroomSeating.deskPlan) || state.classroomSeating.deskPlan.length !== 4) {
                state.classroomSeating.deskPlan = [6, 6, 6, 7];
            } else {
                state.classroomSeating.deskPlan = state.classroomSeating.deskPlan.map((value, index) => {
                    const fallback = [6, 6, 6, 7][index];
                    const parsed = Math.floor(Number(value));
                    return Number.isFinite(parsed) && parsed >= 1 ? parsed : fallback;
                });
            }
            state.classroomSeating.version = 2;
            if (!state.classroomSeating.assignments || typeof state.classroomSeating.assignments !== 'object') {
                state.classroomSeating.assignments = {};
            }

            const validSeatIds = new Set(getClassroomSeatIds());
            const validStudentIds = new Set((state.students || []).map(s => String(s.id)));

            Object.keys(state.classroomSeating.assignments).forEach(seatId => {
                const studentId = state.classroomSeating.assignments[seatId];
                if (!validSeatIds.has(seatId) || !validStudentIds.has(String(studentId))) {
                    delete state.classroomSeating.assignments[seatId];
                }
            });

            if (!state.classroomSeating.initialized) {
                const seatIds = getClassroomSeatIds();
                const students = (state.students || []).slice(0, seatIds.length);
                state.classroomSeating.assignments = {};
                students.forEach((student, index) => {
                    const seatId = seatIds[index];
                    state.classroomSeating.assignments[seatId] = student.id;
                    syncClassroomStudentGroupForSeat(seatId, student.id);
                });
                state.classroomSeating.initialized = true;
            }

            const selectedStudentId = window.classroomUi && window.classroomUi.selectedStudentId;
            if (selectedStudentId) {
                const assignedValues = Object.values(state.classroomSeating.assignments || {}).map(String);
                if (!validStudentIds.has(String(selectedStudentId)) || assignedValues.includes(String(selectedStudentId))) {
                    window.classroomUi.selectedStudentId = null;
                }
            }
        }

        function getClassroomStudentById(studentId) {
            return (state.students || []).find(s => String(s.id) === String(studentId)) || null;
        }

        function getClassroomAssignedStudentIds() {
            ensureClassroomSeatingState();
            return new Set(

        function getClassroomUnassignedStudents() {

        function getClassroomSelectedWaitingStudent() {

        // ================= BADGE BAN C√ÅN S·ª∞ TR√äN S∆† ƒê·ªí L·ªöP =================
        function escapeClassroomRoleText(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')

        function getClassroomRoleBadge(student) {
            if (!student) return null;

            const roles = parseTagsList(student.role)
                .map(role => String(role || '').trim())
                .filter(Boolean)
                .filter(role => !/^(th√†nh vi√™n|h·ªçc sinh)$/i.test(role));

            if (!roles.length) return null;

            const normalize = value => String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/ƒë/g, 'd')
                .replace(/ƒê/g, 'D')
                .toLowerCase();

            const configs = [
                {

                    icon: 'ph-crown',
                    priority: 100
                },
                {

                    label: 'L·ªõp ph√≥ lao ƒë·ªông',
                    cls: 'role-labor-deputy',
                    icon: 'ph-broom',
                    priority: 95
                },
                {
                    test: role => /lop pho/.test(normalize(role)),
                    label: role => role,
                    cls: 'role-class-deputy',
                    icon: 'ph-star',
                    priority: 90
                },
                {
                    test: role => /to truong/.test(normalize(role)),
                    label: 'T·ªï tr∆∞·ªüng',
                    cls: 'role-group-leader',
                    icon: 'ph-medal',
                    priority: 80
                },
                {
                    test: role => /to pho/.test(normalize(role)),
                    label: 'T·ªï ph√≥',
                    cls: 'role-group-deputy',
                    icon: 'ph-shield-star',
                    priority: 70
                },
                {
                    test: role => /(bi thu|chi doi truong|lien doi|sao do)/.test(normalize(role)),
                    label: role => role,
                    cls: 'role-secretary',
                    icon: 'ph-seal-check',
                    priority: 60
                },
                {
                    test: role => /(can su|van the my|van nghe|hoc tap|lao dong)/.test(normalize(role)),
                    label: role => role,
                    cls: 'role-officer',
                    icon: 'ph-identification-card',
                    priority: 50
                }
            ];

            const candidates = roles.map(role => {
                const match = configs.find(cfg => cfg.test(role));
                if (!match) {
                    return {
                        rawRole: role,
                        label: role,
                        cls: 'role-other',
                        icon: 'ph-badge',
                        priority: 10
                    };
                }

                return {
                    rawRole: role,
                    label: typeof match.label === 'function' ? match.label(role) : match.label,
                    cls: match.cls,
                    icon: match.icon,
                    priority: match.priority
                };
            }).sort((a, b) => b.priority - a.priority);

            const primary = candidates[0];
            return {
                ...primary,
                allRoles: roles.join(', ')
            };
        }

        function renderClassroomRoleBadge(student) {
            const badge = getClassroomRoleBadge(student);
            if (!badge) return '';

            const title = `Ban c√°n s·ª±: ${badge.allRoles}`;
            return `
                <span class="classroom-role-badge ${badge.cls}"
                      title="${escapeHtmlAttr(title)}"
                      aria-label="${escapeHtmlAttr(title)}">
                    <i class="ph-fill ${badge.icon}"></i>
                    <span>${escapeClassroomRoleText(badge.label)}</span>
                </span>
            `;
        }

        function renderClassroomSeat(seatId, seatNumber) {
            const student = classroomSeatStudent(seatId);
            const hasPendingStudent = !!getClassroomSelectedWaitingStudent();
            const swapSeatId = String(window.classroomUi?.swapSeatId || '');
            const isSwapSource = swapSeatId === String(seatId);
            const hasSwapSource = !!swapSeatId;
            const seatClass = `classroom-seat ${student ? '' : 'empty-seat'} ${!student && hasPendingStudent ? 'pending-target' : ''} ${isSwapSource ? 'swap-source' : ''} ${hasSwapSource ? 'swap-target-ready' : ''}`;

            if (!student) {
                return `
                    <button type="button"

                         title="${hasSwapSource ? `Chuy·ªÉn h·ªçc sinh ƒëang ch·ªçn sang ch·ªó ${seatNumber}` : `Ch·ªó ${seatNumber} ƒëang tr·ªëng`}">
                        <i class="ph-duotone ph-armchair classroom-empty-icon"></i>
                        <div class="classroom-seat-name text-slate-400">Tr·ªëng</div>
                        <div class="classroom-seat-meta"><span>${seatNumber}</span></div>
                    </button>
                `;
            }

            const roleBadge = getClassroomRoleBadge(student);
            const roleTitle = roleBadge ? ` ‚Ä¢ Ch·ª©c v·ª•: ${roleBadge.allRoles}` : '';

            return `
                <button type="button"
                     class="${seatClass} ${roleBadge ? 'has-classroom-role' : ''}"
                     data-seat-id="${seatId}"
                     onclick="handleClassroomSeatClick(event, '${seatId}')"
                     title="${isSwapSource ? `ƒêang ch·ªçn ${escapeHtmlAttr(student.name)} ƒë·ªÉ ƒë·ªïi ch·ªó` : (hasSwapSource ? `ƒê·ªïi ch·ªó v·ªõi ${escapeHtmlAttr(student.name)}` : `Ch·ªçn ${escapeHtmlAttr(student.name)} ƒë·ªÉ ƒë·ªïi ch·ªó`)}${escapeHtmlAttr(roleTitle)}">

        function preventClassroomDefault(event) {
            if (!event) return;
            if (typeof event.preventDefault === 'function') event.preventDefault();

        }

        function captureClassroomViewport() {
            const main = document.getElementById('main-content');
            const map = document.getElementById('classroom-map-scroll');
            const pool = document.getElementById('classroom-unassigned-pool');

            return {
                mainTop: main ? main.scrollTop : 0,
                mainLeft: main ? main.scrollLeft : 0,
                mapTop: map ? map.scrollTop : 0,
                mapLeft: map ? map.scrollLeft : 0,
                poolTop: pool ? pool.scrollTop : 0,
                poolLeft: pool ? pool.scrollLeft : 0,
                windowY: window.scrollY || 0,
                windowX: window.scrollX || 0
            };
        }

        function restoreClassroomViewport(snapshot) {
            if (!snapshot) return;

            const apply = () => {
                const main = document.getElementById('main-content');
                const map = document.getElementById('classroom-map-scroll');
                const pool = document.getElementById('classroom-unassigned-pool');

                if (main) {
                    main.style.scrollBehavior = 'auto';
                    main.scrollTop = Number(snapshot.mainTop) || 0;
                    main.scrollLeft = Number(snapshot.mainLeft) || 0;
                }

                if (map) {
                    map.style.scrollBehavior = 'auto';
                    map.scrollTop = Number(snapshot.mapTop) || 0;
                    map.scrollLeft = Number(snapshot.mapLeft) || 0;
                }

                if (pool) {
                    pool.style.scrollBehavior = 'auto';
                    pool.scrollTop = Number(snapshot.poolTop) || 0;
                    pool.scrollLeft = Number(snapshot.poolLeft) || 0;
                }

                try {
                    window.scrollTo({
                        top: Number(snapshot.windowY) || 0,
                        left: Number(snapshot.windowX) || 0,
                        behavior: 'auto'
                    });
                } catch (error) {
                    window.scrollTo(
                        Number(snapshot.windowX) || 0,
                        Number(snapshot.windowY) || 0
                    );
                }
            };

            apply();
            requestAnimationFrame(() => {
                apply();
                requestAnimationFrame(apply);
            });
            setTimeout(apply, 0);
            setTimeout(apply, 50);
            setTimeout(apply, 140);
            setTimeout(apply, 280);
        }

        function renderClassroomPreservingViewport(snapshot = null) {
            const savedViewport = snapshot || captureClassroomViewport();
            renderLayout();
            restoreClassroomViewport(savedViewport);
        }

                `B√†n m·ªõi g·ªìm 2 ch·ªó ng·ªìi tr·ªëng.`

        function dutyKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
        function dutyParse(k){const[a,b,c]=String(k).split('-').map(Number);return new Date(a,(b||1)-1,c||1)}

            const prefix=getDutyExtraSourcePrefix(taskId);

            (state.students||[]).forEach(student=>{
                if(!Array.isArray(student.history))student.history=[];

                const matched=student.history.filter(entry=>
                    typeof entry?.sourceId==='string' &&
                    entry.sourceId.startsWith(prefix)
                );

                if(!matched.length)return;

                const pointDelta=matched.reduce(
                    (sum,entry)=>sum+(Number(entry.points)||0),
                    0
                );
                const starDelta=matched.reduce(
                    (sum,entry)=>sum+(
                        entry.actualStars!==undefined
                            ? (Number(entry.actualStars)||0)
                            : (Number(entry.points)||0)
                    ),
                    0
                );

                student.points=Math.max(
                    0,
                    (Number(student.points)||0)-pointDelta
                );
                student.stars=Math.max(
                    0,
                    (Number(student.stars)||0)-starDelta
                );

                    !(
                        typeof entry?.sourceId==='string' &&
                        entry.sourceId.startsWith(prefix)

                );
            });

        // ================= H√ÄM T√çNH TO√ÅN TI·∫æN ƒê·ªò THI ƒêUA (TU·∫¶N / TH√ÅNG) =================
        let overviewProgressMode = 'tuan'; // 'tuan' ho·∫∑c 'thang'

        function getOverviewProgressPeriod(mode = overviewProgressMode) {
            const now = new Date();
            let start;
            let end;
            let label;
            let shortLabel;

            if (mode === 'thang') {
                start = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
                end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
                label = `Th√°ng ${now.getMonth() + 1}/${now.getFullYear()}`;
                shortLabel = 'th√°ng n√†y';
            } else {
                const mondayOffset = now.getDay() === 0 ? 6 : now.getDay() - 1;
                start = new Date(now);
                start.setDate(now.getDate() - mondayOffset);
                start.setHours(0, 0, 0, 0);

                end = new Date(start);
                end.setDate(start.getDate() + 6);
                end.setHours(23, 59, 59, 999);

                label = 'Tu·∫ßn n√†y';
                shortLabel = 'tu·∫ßn n√†y';
            }

            const formatDate = date => date.toLocaleDateString('vi-VN');
            return {
                mode,
                start,
                end,
                label,
                shortLabel,
                rangeText: `${formatDate(start)} - ${formatDate(end)}`
            };
        }

        window.setOverviewMode = function(mode) {
            if (!['tuan', 'thang'].includes(mode)) return;

            overviewProgressMode = mode;

            const container = document.getElementById('progress-ranking-container');
            if (container) {
                container.innerHTML = renderProgressRankingHtml();
            }

            updateOverviewModeButtons();

            const rangeLabel = document.getElementById('overview-progress-period-label');
            if (rangeLabel) {
                const period = getOverviewProgressPeriod();
                rangeLabel.textContent = `${period.label} ‚Ä¢ ${period.rangeText}`;
            }
        };

        function updateOverviewModeButtons() {
            const btnTuan = document.getElementById('btn-mode-tuan');
            const btnThang = document.getElementById('btn-mode-thang');
            if (!btnTuan || !btnThang) return;

            const activeClass = "px-3.5 py-1.5 rounded-xl text-xs font-black bg-[#1e1b4b] text-white shadow-sm transition-all";
            const inactiveClass = "px-3.5 py-1.5 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 transition-all";

            btnTuan.className = overviewProgressMode === 'tuan' ? activeClass : inactiveClass;
            btnThang.className = overviewProgressMode === 'thang' ? activeClass : inactiveClass;
        }

        function calculateProgressRanking() {
            const students = state.students || [];
            const period = getOverviewProgressPeriod();

            const result = students.map(student => {
                let positivePoints = 0;
                let negativePoints = 0;
                let eventCount = 0;

                (student.history || []).forEach(historyItem => {
                    if (!historyItem || !historyItem.date) return;

                    const historyDate = new Date(historyItem.date);
                    if (Number.isNaN(historyDate.getTime())) return;
                    if (historyDate < period.start || historyDate > period.end) return;

                    const points = Number(historyItem.points) || 0;
                    if (points > 0) positivePoints += points;
                    if (points < 0) negativePoints += Math.abs(points);
                    if (points !== 0) eventCount++;
                });

                const periodPoints = positivePoints - negativePoints;

                return {
                    id: student.id,
                    name: student.name,
                    group: student.group,
                    avatarUrl: student.avatarUrl,
                    currentPoints: Number(student.points) || 0,
                    periodPoints,
                    positivePoints,
                    negativePoints,
                    eventCount,
                    hasMovement: eventCount > 0
                };
            });

            // X·∫øp h·∫°ng ch·ªâ theo d·ªØ li·ªáu c·ªßa giai ƒëo·∫°n ƒëang ch·ªçn.
            // Tuy·ªát ƒë·ªëi kh√¥ng fallback v·ªÅ t·ªïng ƒëi·ªÉm c·∫£ nƒÉm.
            result.sort((a, b) =>
                b.periodPoints - a.periodPoints ||
                b.positivePoints - a.positivePoints ||
                a.negativePoints - b.negativePoints ||
                b.eventCount - a.eventCount ||
                String(a.name || '').localeCompare(String(b.name || ''), 'vi')
            );

            return result;
        }

        // ================= AUTOCOMPLETE T√åM H·ªåC SINH KHI T√çCH ƒêI·ªÇM =================
        let pointStudentSuggestionIndex = -1;

        function escapePointHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }

        function normalizePointSearch(value) {
            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/ƒë/g, 'd')
                .replace(/ƒê/g, 'D')
                .toLowerCase()
                .trim();
        }

        function getAllowedPointStudentsForSearch() {
            let students = [...(state.students || [])];
            const officerRole = getCurrentOfficerRole();

            if (
                currentLoginRole === 'bcs' &&
                officerRole &&
                officerRole.scope === 'group' &&
                officerRole.groupName
            ) {
                students = students.filter(s => s.group === officerRole.groupName);
            }

            return students.sort((a, b) =>
                String(a.name || '').localeCompare(String(b.name || ''), 'vi')
            );
        }

        window.onPointStudentSearch = function(value, forceOpen = false) {
            const menu = document.getElementById('pf-student-suggestions');
            if (!menu) return;

            const students = getAllowedPointStudentsForSearch();
            const query = normalizePointSearch(value);

            // N·∫øu ƒë√£ ch·ªçn m·ªôt h·ªçc sinh nh∆∞ng ng∆∞·ªùi d√πng g√µ n·ªôi dung kh√°c, h·ªßy l·ª±a ch·ªçn c≈©.
            const selected = students.find(
                s => String(s.id) === String(state.pointsForm.selectedTargetId)
            );

            if (selected && normalizePointSearch(selected.name) !== query) {
                state.pointsForm.selectedTargetId = '';
                const clearButton = document.getElementById('pf-student-clear-btn');
                if (clearButton) clearButton.classList.add('hidden');

                const badge = document.getElementById('points-target-badge');
                if (badge) badge.innerHTML = 'ƒêang t√¨m h·ªçc sinh...';
                updatePointsPreviewState();
            }

            let results;
            if (!query) {
                results = students.slice(0, 8);
            } else {
                results = students
                    .map(student => {
                        const normalizedName = normalizePointSearch(student.name);
                        const normalizedGroup = normalizePointSearch(student.group);
                        const normalizedCode = normalizePointSearch(student.code);
                        let priority = 9;

                        if (normalizedName.startsWith(query)) priority = 0;
                        else if (normalizedName.includes(query)) priority = 1;
                        else if (normalizedCode.includes(query)) priority = 2;
                        else if (normalizedGroup.includes(query)) priority = 3;

                        return { student, priority };
                    })
                    .filter(item => item.priority < 9)
                    .sort((a, b) => {
                        if (a.priority !== b.priority) return a.priority - b.priority;
                        return String(a.student.name || '').localeCompare(String(b.student.name || ''), 'vi');
                    })
                    .slice(0, 10)
                    .map(item => item.student);
            }

            pointStudentSuggestionIndex = -1;

            if (!results.length) {
                menu.innerHTML = `

                    </div>
                `;
                menu.classList.remove('hidden');
                return;
            }

            menu.innerHTML = results.map(student => {
                const firstLetter = String(student.name || '?').trim().charAt(0).toUpperCase();
                return `

                        type="button"

                    >
                        <div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600
                                    text-white flex items-center justify-center font-black shadow-sm
                                    group-hover:scale-105 transition-transform">
                            ${escapePointHtml(firstLetter)}
                        </div>

                        <div class="min-w-0 flex-1">
                            <div class="text-sm font-black text-slate-800 truncate">
                                ${escapePointHtml(student.name)}
                            </div>
                            <div class="flex flex-wrap items-center gap-1.5 mt-1">
                                <span class="text-[9px] font-black px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-600">
                                    ${escapePointHtml(student.group || 'Ch∆∞a ph√¢n t·ªï')}
                                </span>
                                ${student.code ? `
                                    <span class="text-[9px] font-bold text-slate-400">
                                        M√£ ${escapePointHtml(student.code)}

                            <div class="font-black text-indigo-700 text-sm">${Number(student.points) || 0}ƒë</div>

            }).join('');

            if (forceOpen || query.length > 0 || document.activeElement?.id === 'pf-student-search') {

        window.hidePointStudentSuggestions = function() {

        window.onPointStudentSearchKeydown = function(event) {
            const menu = document.getElementById('pf-student-suggestions');
            if (!menu) return;

            const items = [...menu.querySelectorAll('[data-point-student-option]')];
            if (!items.length) return;

            if (event.key === 'ArrowDown') {
                event.preventDefault();
                pointStudentSuggestionIndex++;
                if (pointStudentSuggestionIndex >= items.length) pointStudentSuggestionIndex = 0;
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                pointStudentSuggestionIndex--;
                if (pointStudentSuggestionIndex < 0) pointStudentSuggestionIndex = items.length - 1;
            } else if (event.key === 'Enter') {
                if (pointStudentSuggestionIndex >= 0 && items[pointStudentSuggestionIndex]) {
                    event.preventDefault();
                    items[pointStudentSuggestionIndex].click();
                } else if (items.length === 1) {
                    event.preventDefault();
                    items[0].click();
                }
                return;
            } else if (event.key === 'Escape') {
                hidePointStudentSuggestions();
                return;
            } else {
                return;
            }

            items.forEach((item, index) => {
                if (index === pointStudentSuggestionIndex) {
                    item.classList.add('bg-indigo-50');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('bg-indigo-50');
                }
            });
        };

        function renderCriteriaCardsHtml(criteriaList, isAdd) {
            const colorClass = isAdd
                ? 'bg-emerald-50/50 hover:bg-emerald-50 border-emerald-100'
                : 'bg-rose-50/50 hover:bg-rose-50 border-rose-100';
            const pointColor = isAdd ? 'text-emerald-600' : 'text-rose-600';
            const signText = isAdd ? '+' : '-';
            const actionType = isAdd ? 'add' : 'subtract';
            const canDeleteQuickReason = currentLoginRole === 'gvcn';

            return criteriaList.map(c => `

                    <button
                        type="button"
                        onclick="applyQuickCriterion('${escapeInlineJs(c.reason)}', ${c.points}, '${escapeInlineJs(c.category)}')"
                        class="min-w-0 flex-1 flex items-center justify-between gap-2 p-2 text-left">
                        <div class="font-bold text-slate-700 text-[10px] line-clamp-1 min-w-0">
                            ${c.reason}
                        </div>
                        <div class="font-black text-[10px] shrink-0 ${pointColor}">
                            ${signText}${c.points}ƒë
                        </div>
                    </button>

                    ${canDeleteQuickReason ? `
                        <button
                            type="button"
                            onclick="event.stopPropagation(); deleteQuickCriterion('${actionType}', '${escapeInlineJs(c.reason)}')"
                            class="w-7 shrink-0 flex items-center justify-center text-slate-300
                                   hover:text-rose-600 hover:bg-rose-100/80 transition-colors"
                            title="X√≥a l√Ω do kh·ªèi M·∫´u nhanh"
                            aria-label="X√≥a l√Ω do ${escapeHtmlAttr(c.reason)}">
                            <i class="ph-bold ph-x text-[11px]"></i>
                        </button>
                    ` : ''}
                </div>
            `).join('');
        }

        // T·ª± h·ªçc l√Ω do m·ªõi: sau khi x√°c nh·∫≠n, l√Ω do ch∆∞a c√≥ s·∫Ω ƒë∆∞·ª£c l∆∞u v√†o M·∫´u nhanh.
        function normalizeQuickCriterionReason(value) {
            return String(value || '').trim().replace(/\s+/g, ' ').toLowerCase();
        }

        function saveNewReasonToQuickCriteria(actionType, reason, points, category) {
            if (!state.criteria) state.criteria = { version: 3, positive: [], negative: [] };
            if (!Array.isArray(state.criteria.positive)) state.criteria.positive = [];
            if (!Array.isArray(state.criteria.negative)) state.criteria.negative = [];

            const list = actionType === 'add' ? state.criteria.positive : state.criteria.negative;
            const cleanReason = String(reason || '').trim().replace(/\s+/g, ' ');
            const normalizedReason = normalizeQuickCriterionReason(cleanReason);
            const absPoints = Math.abs(parseInt(points) || 0);

            if (!cleanReason || !absPoints) return false;

            // M·ªôt l√Ω do ch·ªâ xu·∫•t hi·ªán m·ªôt l·∫ßn trong c√πng nh√≥m C·ªông ho·∫∑c Tr·ª´.
            const existed = list.some(item =>
                normalizeQuickCriterionReason(item && item.reason) === normalizedReason
            );
            if (existed) return false;

            // ƒê∆∞a m·∫´u m·ªõi l√™n ƒë·∫ßu ƒë·ªÉ ng∆∞·ªùi d√πng th·∫•y v√† t√°i s·ª≠ d·ª•ng ngay.
            list.unshift({
                points: absPoints,
                reason: cleanReason,
                category: category || 'Kh√°c'
            });
            return true;
        }

        function refreshQuickCriteriaList(actionType = state.pointsForm.actionType) {
            const isAdd = actionType === 'add';
            const list = isAdd ? (state.criteria?.positive || []) : (state.criteria?.negative || []);
            const filtered = list.filter(c => canManagePointsCategory(c.category));
            const container = document.getElementById('criteria-list-container');
            if (container) {
                container.innerHTML = renderCriteriaCardsHtml(filtered, isAdd);
                container.scrollTop = 0;
            }
        }

        window.deleteQuickCriterion = function(actionType, reason) {
            if (currentLoginRole !== 'gvcn') {
                return showToast('Ch·ªâ Gi√°o vi√™n ch·ªß nhi·ªám m·ªõi ƒë∆∞·ª£c x√≥a M·∫´u nhanh.', 'error');
            }

            const listKey = actionType === 'add' ? 'positive' : 'negative';
            const list = state.criteria && Array.isArray(state.criteria[listKey])
                ? state.criteria[listKey]
                : [];

            const normalized = normalizeQuickCriterionReason(reason);
            const index = list.findIndex(item =>
                normalizeQuickCriterionReason(item && item.reason) === normalized
            );

            if (index < 0) {
                return showToast('Kh√¥ng t√¨m th·∫•y l√Ω do c·∫ßn x√≥a.', 'error');
            }

            const reasonText = list[index].reason || reason;
            if (!confirm(`X√≥a l√Ω do "${reasonText}" kh·ªèi M·∫´u nhanh?`)) return;

            list.splice(index, 1);
            saveData();
            refreshQuickCriteriaList(actionType);

            showToast(`ƒê√£ x√≥a "${reasonText}" kh·ªèi M·∫´u nhanh.`, 'success');
        };


        window.setPointsActionType = function(type) {
            state.pointsForm.actionType = type;
            const isAdd = type === 'add';
            
            // C·∫≠p nh·∫≠t giao di·ªán n√∫t lo·∫°i

            }

            if (signEl) {

            }

            // C·∫≠p nh·∫≠t danh s√°ch ti√™u ch√≠ nhanh tr·ª±c ti·∫øp
            const officerRole = getCurrentOfficerRole();
            const rawCriteriaList = isAdd ? state.criteria.positive : state.criteria.negative;
            const filteredCriteria = (currentLoginRole === 'bcs' && officerRole)
                ? rawCriteriaList.filter(c => officerRole.allowedCategories.includes(c.category))

        window.setPointsTargetType = function(type) {
            state.pointsForm.targetType = type;
            state.pointsForm.selectedTargetId = type === 'class' ? 'class' : '';

            // C·∫≠p nh·∫≠t tr·∫°ng th√°i 3 n√∫t
            ['student', 'group', 'class'].forEach(t => {
                const btn = document.getElementById(`btn-target-${t}`);

                    btn.className = `flex-1 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${type === t ? 'bg-[#1e1b4b] text-white shadow-md' : 'bg-slate-50 border border-slate-200 text-slate-600'}`;
                }
            });

            // C·∫≠p nh·∫≠t selector t∆∞∆°ng ·ª©ng
            const officerRole = getCurrentOfficerRole();
            let allowedStudents = state.students;
            let allowedGroups = state.groups;
            if (currentLoginRole === 'bcs' && officerRole && officerRole.scope === 'group' && officerRole.groupName) {
                allowedStudents = state.students.filter(s => s.group === officerRole.groupName);

            const targetContainer = document.getElementById('target-selector-container');

        function executeRedeem(studentId, itemId) {

            if (!student || !item) {
                return showToast('Kh√¥ng t√¨m th·∫•y h·ªçc sinh ho·∫∑c ph·∫ßn qu√† c·∫ßn ƒë·ªïi.', 'error');

            }

            const isHonorReward = item.id === 'r11';
            const confirmText = isHonorReward
